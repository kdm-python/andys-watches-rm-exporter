[project]
name = "rm-exporter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle Marden", email = "demolaze@Mac.home" }
]
requires-python = ">=3.9"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.8",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
]

[project.scripts]
rm-exporter = "rm_exporter.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.4.2",
]
